<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b6b50" />
  <title>CEB Energy Saver - Secure Access</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: var(--bg-alt);
    }
    .auth-container {
      background: var(--card);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border);
    }
    .dark .auth-container {
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header .brand-mark {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      display: inline-block;
    }
    .auth-header h1 {
      font-size: 1.5rem;
      color: var(--text);
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .auth-form label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: -0.5rem;
    }
    .auth-form input {
      padding: 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    .auth-form input:focus {
      outline: none;
      border-color: var(--green);
    }
    .auth-form button {
      margin-top: 1rem;
      padding: 0.8rem;
    }
    .auth-switch {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .auth-switch a {
      color: var(--green);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .error-msg {
      color: var(--danger, #ff4d4f);
      font-size: 0.85rem;
      margin-top: -0.5rem;
      display: none;
    }
  </style>
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <div class="auth-container">
    <div class="auth-header">
      <div class="brand-mark">⚡</div>
      <h1 id="authTitle">Welcome Back</h1>
      <p class="muted" id="authSubtitle">Sign in to manage your energy</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form">
      <label>Email Address</label>
      <input type="email" id="loginEmail" required placeholder="you@example.com">
      
      <label>Password</label>
      <input type="password" id="loginPassword" required placeholder="••••••••">
      
      <div id="loginError" class="error-msg"></div>
      
      <button type="submit" class="primary full">Sign In</button>
      
      <div class="auth-switch">
        Don't have an account? <a id="showSignup">Create one</a>
      </div>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" class="auth-form" style="display: none;">
      <label>Full Name</label>
      <input type="text" id="signupName" required placeholder="Vishnu">

      <label>Email Address</label>
      <input type="email" id="signupEmail" required placeholder="you@example.com">
      
      <label>Password</label>
      <input type="password" id="signupPassword" required placeholder="••••••••">
      
      <div id="signupError" class="error-msg"></div>
      
      <button type="submit" class="primary full">Create Account</button>
      
      <div class="auth-switch">
        Already have an account? <a id="showLogin">Sign In</a>
      </div>
    </form>
  </div>

  <script src="auth.js"></script>
</body>
</html>
