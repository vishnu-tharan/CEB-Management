name: ceb-energy-saver
services:
  app:
    image: ceb-energy-saver:local
    build:
      context: .
      target: app
    ports:
      - "127.0.0.1:${CEB_PORT:-3002}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DB_PATH: /data/database.sqlite
    volumes:
      - household-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

volumes:
  household-data:
